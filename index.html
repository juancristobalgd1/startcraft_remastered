<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <title>StarCraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StarCraft">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="pwa/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/mapStyle.css" />
    <link rel="stylesheet" href="css/buttonStyle.css" />
    <link rel="stylesheet" href="css/portraitStyle.css" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/modern_ui.css" />
</head>

<body>
    <div id="GameLoading" class="GameLayer">
        <div class="LoadingDiv">
            <div class="LoadingMsg">Now Loading...</div>
            <div class="LoadingBlock">
                <div class="LoadedBlock"></div>
            </div>
        </div>
    </div>
    <div id="GameStart" class="GameLayer">
        <div class="levelSelectionBg"></div>
    </div>
    <div id="GamePlay" class="GameLayer" race="Terran">
        <button id="PauseButton" type="button">Pause</button>
        <div id="GameHUD"></div>
        <div id="PauseMenu" aria-hidden="true">
            <div class="pauseMenuPanel">
                <div class="pauseMenuTitle">Paused</div>
                <button id="PauseResume" type="button">Resume</button>
                <button id="PauseRestart" type="button">Restart</button>
                <button id="PauseToggleMetrics" type="button">Toggle FPS/Input</button>
                <button id="PauseToggleHaptics" type="button">Toggle Haptics</button>
                <button id="PauseUiScale" type="button">UI Size: Normal</button>
                <button id="PauseReducedMotion" type="button">Reduced Motion: Off</button>
                <button id="PauseFontScale" type="button">Font Size: Normal</button>
            </div>
        </div>
        <canvas id="backCanvas"></canvas>
        <canvas id="middleCanvas"></canvas>
        <canvas id="frontCanvas"></canvas>
        <div class="panel_Map">
            <canvas name="mini_map" width="130" height="130"></canvas>
        </div>
        <div class="panel_Info">
            <div class="infoLeft">
                <div name="portrait"></div>
                <div id="HP_SP">
                    <span class="_Shield"><span class="shield"></span>/<span class="SP"></span></span> <span
                        class="_Health"><span class="life"></span>/<span class="HP"></span></span>
                </div>
                <div id="MP">
                    <span class="_Magic"><span class="magic"></span>/<span class="MP"></span></span>
                </div>
            </div>
            <div class="infoCenter">
                <h3 class="name"></h3>
                <p class="detector">Detector</p>
                <p class="kill">Kill:<span></span></p>
                <p class="damage">Damage:<span></span></p>
                <p class="armor">Armor:<span></span></p>
                <p class="plasma">Plasma:<span></span></p>
            </div>
            <div class="infoRight">
                <div class="upgraded">
                    Upgraded:&nbsp;&nbsp;
                    <div name="icon"></div>
                    <div name="icon"></div>
                    <div name="icon"></div>
                </div>
                <div class="upgrading">
                    <div name="icon"></div>
                    <div name="processing">
                        <span></span>%<br>
                        <div class="processBar">
                            <div class="processedBar"></div>
                        </div>
                        <div class="queue"></div>
                    </div>
                </div>
            </div>
            <div class="override">
                <div class="multiSelection">
                    <div name="portrait" class="Lurker"></div>
                </div>
            </div>
        </div>
        <div class="panel_Control"></div>
        <div class="warning_Box"></div>
        <div id="cheat_Box">
            Message: <input type="text" id="cheatInput" />
        </div>
        <div class="message_Box"></div>
        <div class="resource_Box">
            <div class="mine"></div>
            <span class="mineNum"></span>
            <div class="gas"></div>
            <span class="gasNum"></span>
            <div class="man"></div>
            <span class="manNum"><span></span>/<span></span></span>
        </div>
        <div class="tooltip_Box">
            <div class="itemName"></div>
            <div class="cost">
                <div class="mine"></div>
                <span class="mineNum"></span>
                <div class="gas"></div>
                <span class="gasNum"></span>
                <div class="man"></div>
                <span class="manNum"></span>
                <div class="magic"></div>
                <span class="magicNum"></span>
            </div>
        </div>
    </div>
    <div id="GameWin" class="GameLayer"></div>
    <div id="GameLose" class="GameLayer"></div>

    <script src="Utils/jquery.min.js"></script>
    <!--<script src="Utils/alloyimage.min.js"></script>-->
    <script src="Utils/gFrame.js"></script>
    <script src="Utils/sourceLoader.js"></script>
    <script src="Characters/Gobj.js"></script>
    <script src="Characters/Burst.js"></script>
    <script src="Characters/Animation.js"></script>
    <script src="Characters/Units.js"></script>
    <script src="Characters/Magic.js"></script>
    <script src="Characters/Upgrade.js"></script>
    <script src="Characters/Building.js"></script>
    <script src="Characters/Zerg.js"></script>
    <script src="Characters/Terran.js"></script>
    <script src="Characters/Protoss.js"></script>
    <script src="Characters/Neutral.js"></script>
    <script src="Characters/Hero.js"></script>
    <script src="Characters/Bullets.js"></script>
    <script src="Characters/Button.js?v=4"></script>
    <script src="Characters/Map.js?v=5"></script>
    <script src="GameRule/Resource.js"></script>
    <script src="GameRule/Referee.js"></script>
    <script src="GameRule/Levels.js?v=6"></script>
    <script src="GameRule/Game.js?v=4"></script>
    <script src="GameRule/Cheat.js?v=4"></script>
    <script src="Controller/mouseController.js?v=4"></script>
    <script src="Controller/keyController.js?v=4"></script>

    <script>
        //########## AutoStart ##########//
        $('body')[0].onload = function () {
            Game.init();
        };
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js");
            });
        }
    </script>
    <script>
        if (screen && screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(function () { });
        }
    </script>
</body>

</html>
